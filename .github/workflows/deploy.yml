name: Deploy Kiddo Adventures

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply game V2 policy
        run: python scripts/apply_game_v2.py

      - name: Restore profile controls and level states
        run: |
          python scripts/restore_profile_controls_and_level_status.py
          python scripts/add_level_detail_api.py

      - name: Install frontend
        run: npm install --prefix web

      - name: Build frontend
        run: npm run build --prefix web

      - name: Deploy Worker + frontend assets
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
