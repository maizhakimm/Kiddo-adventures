name: Apply Kiddo product updates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_product_updates.py'
      - 'scripts/apply_game_v2.py'
      - '.github/workflows/apply-product-updates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product updates
        run: python scripts/apply_product_updates.py
      - name: Apply V2 game interactions
        run: python scripts/apply_game_v2.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.jsx worker/src/index.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish V2 game interactions and child-friendly prompts"
            git push
          fi
