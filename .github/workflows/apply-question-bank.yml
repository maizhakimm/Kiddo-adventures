name: Apply Kiddo question bank

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_question_bank.py'
      - '.github/workflows/apply-question-bank.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate question bank
        run: python scripts/apply_question_bank.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/main.jsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use structured question bank across all worlds"
            git push
          fi
